{% extends "base.html" %}

{% block title %}Tendencias - BlueTeamBot{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h1 class="mb-4">
            <i class="bi bi-graph-up text-primary"></i> Análisis de Tendencias
        </h1>
    </div>
</div>

<div class="row mb-3">
    <div class="col-md-6">
        <label for="daysSelect" class="form-label">Período de análisis:</label>
        <select id="daysSelect" class="form-select" onchange="loadTrends()">
            <option value="7">Últimos 7 días</option>
            <option value="30" selected>Últimos 30 días</option>
            <option value="60">Últimos 60 días</option>
            <option value="90">Últimos 90 días</option>
        </select>
    </div>
</div>

<div class="row">
    <div class="col-12 mb-4">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h5><i class="bi bi-graph-up"></i> Tendencia Global de Severidades</h5>
            </div>
            <div class="card-body">
                <canvas id="globalTrendChart" height="60"></canvas>
            </div>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header bg-secondary text-white">
                <h5><i class="bi bi-hdd-network"></i> Tendencias por Host</h5>
            </div>
            <div class="card-body">
                <div id="hostChartsContainer"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    let globalChart = null;
    
    function loadTrends() {
        const days = document.getElementById('daysSelect').value;
        
        // Tendencia global
        fetch(`/api/severity-trends?days=${days}`)
            .then(response => response.json())
            .then(data => {
                const ctx = document.getElementById('globalTrendChart').getContext('2d');
                
                if (globalChart) {
                    globalChart.destroy();
                }
                
                globalChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data.dates,
                        datasets: [
                            {
                                label: 'HIGH',
                                data: data.HIGH,
                                borderColor: 'rgb(220, 53, 69)',
                                backgroundColor: 'rgba(220, 53, 69, 0.1)',
                                tension: 0.3,
                                fill: true
                            },
                            {
                                label: 'MEDIUM',
                                data: data.MEDIUM,
                                borderColor: 'rgb(255, 193, 7)',
                                backgroundColor: 'rgba(255, 193, 7, 0.1)',
                                tension: 0.3,
                                fill: true
                            },
                            {
                                label: 'LOW',
                                data: data.LOW,
                                borderColor: 'rgb(25, 135, 84)',
                                backgroundColor: 'rgba(25, 135, 84, 0.1)',
                                tension: 0.3,
                                fill: true
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        plugins: {
                            legend: { position: 'top' },
                            title: {
                                display: true,
                                text: 'Evolución de hallazgos por severidad'
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    }
                });
            });
        
        // Tendencias por host
        fetch(`/api/host-trends?days=${days}`)
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('hostChartsContainer');
                container.innerHTML = '';
                
                Object.keys(data).forEach(host => {
                    const hostData = data[host];
                    const div = document.createElement('div');
                    div.className = 'mb-4';
                    div.innerHTML = `
                        <h6 class="text-muted">Host: ${host}</h6>
                        <canvas id="host-${host.replace(/\./g, '-')}" height="80"></canvas>
                    `;
                    container.appendChild(div);
                    
                    const ctx = document.getElementById(`host-${host.replace(/\./g, '-')}`).getContext('2d');
                    new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: hostData.dates,
                            datasets: [
                                {
                                    label: 'HIGH',
                                    data: hostData.HIGH,
                                    borderColor: 'rgb(220, 53, 69)',
                                    tension: 0.3
                                },
                                {
                                    label: 'MEDIUM',
                                    data: hostData.MEDIUM,
                                    borderColor: 'rgb(255, 193, 7)',
                                    tension: 0.3
                                },
                                {
                                    label: 'LOW',
                                    data: hostData.LOW,
                                    borderColor: 'rgb(25, 135, 84)',
                                    tension: 0.3
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: true,
                            plugins: {
                                legend: { position: 'top' }
                            }
                        }
                    });
                });
            });
    }
    
    // Cargar al inicio
    loadTrends();
</script>
{% endblock %}
